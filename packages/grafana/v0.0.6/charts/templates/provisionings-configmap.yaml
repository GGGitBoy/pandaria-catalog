apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  name: {{ template "app.provisionings.fullname" . }}
data:
  grafana.ini: |+
    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Admin

    [auth.proxy]
    enabled = true
    header_name = X-RANCHER-USER
    header_property = username
    auto_sign_up = true

    [log.console]
    level = debug

    [security]
    allow_embedding = true

    [auth.anonymous]
    enabled = true
    org_role = Viewer
    
  dashboards.yaml: |+
    - name: RANCHER_MONITORING
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 0 #never
      options:
        path: /var/lib/grafana/rancher-dashboards


  datasources.yaml: |+
    apiVersion: 1

    datasources:
    - name: RANCHER_MONITORING
      type: prometheus
      access: proxy
      basicAuth: false
      editable: false
      isDefault: true
      url: {{ .Values.prometheusDatasourceURL }}