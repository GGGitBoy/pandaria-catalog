{{- $serverUrl := .Values.serverUrl | required ".Values.serverUrl is required." -}}
{{- $clusterName := .Values.clusterName | required ".Values.clusterName is required." -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "suse-ai-observability-extension.fullname" . }}-init
  labels:
    app: {{ include "suse-ai-observability-extension.name" . }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
spec:
  template:
    spec:
      {{- include "suse-ai-observability-extension.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: setup
        image: "{{ with (coalesce .Values.global.imageRegistry .Values.setupImage.registry) }}{{ . }}/{{ end }}{{ .Values.setupImage.repository }}:{{ .Values.setupImage.tag | default $.Chart.AppVersion }}"
        env:
        - name: STACKSTATE_API_URL
          value: {{$serverUrl}}
        - name: STACKSTATE_API_KEY
          valueFrom:
            secretKeyRef:
              key: API_KEY
              name: {{ include "suse-ai-observability-extension.fullname" . }}-secret
        - name: STACKSTATE_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: API_TOKEN
              name: {{ include "suse-ai-observability-extension.fullname" . }}-secret
        - name: KUBERNETES_IN_CLUSTER
          value: "true"
        - name: KUBERNETES_CLUSTER
          value: {{ $clusterName }}
        - name: INSTANCE_TYPE
          value: openlit
        - name: INSTANCE_URL
          value: {{ $clusterName }}
      restartPolicy: Never
  backoffLimit: 4
