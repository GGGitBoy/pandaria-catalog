apiVersion: 1
groups:
    - orgId: 1
      name: inspection-resource
      folder: alerting-resource
      interval: 5m
      rules:
        - uid: a278df7f-d250-4446-9f8b-b6bb63fee4ad
          title: PVC High Usage
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: P6F3BD16D8874DFE6
              model:
                editorMode: code
                expr: (sum(kubelet_volume_stats_used_bytes) by (persistentvolumeclaim, prometheus_from) ) / (sum(kubelet_volume_stats_capacity_bytes) by (persistentvolumeclaim, prometheus_from) ) * 100
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: B
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 70
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            summary: PVC 使用率超过 70%
          isPaused: false
